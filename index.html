<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">
    <title>Tech Apprenticeship Survey</title>
    </head>
    <body>
      <h1 id="title">Tech Apprenticeship Survey</h1>
      <p id="description">
        Tell us about your interests and goals in technology apprenticeships.</p>
        <form id="survey-form">
          <label id="name-label"for="name">
            Full Name
            </label>
            <input
            id="name"
            type="text"
            placeholder="Enter your full name"required>
            <label id="email-label" for="email"> Email Address </label>
            <input 
            Id="email"
            type="email"
            placeholder="Enter your email"
            required>

            <br><br>
            <label id="number-label" for="number"> Age
          </label>
          <input
          id="number"
          type="number"
          min="16"
          max="100"
          placeholder="Enter your age"
          >
          <br><br>
          <label for="dropdown">
            Which technology career interests you?</label>
            <select id="dropdown">
              <option value="">Select an option</option>
              <option value="devops">DevOps Engineer</option>
              <option value="software">Software Developer</option>
              <option value="cyber"> Cyber Security</option>
              <option value="cloud">Cloud Engineering</option>
              </select>
              <br><br>
              <p>Have you studied coding before?</p>
              <label>
                <input 
                type="radio"
                name="coding-experience"
                value="yes"
                >
                Yes
                </label>

<label>
  <input
  type="radio"
  name="coding-experience"
  value="no"
  >
  No
  </label>
  <br><br>
  <p>Which technical skills interested you?</p>
  <label>
    <input
    type="checkbox"
    value="html"
    >
    HTML
    </label>

    <label>
      <input
      type="checkbox"
      value="python"
      >
      Python
      </label>
      <label>
        <input
        type="checkbox"
        value="cloud"
        >
        Cloud Computing
        </label>
        <br><br>
        <label for="comments">
          Additonal Comments
          </label>

          <br>

          <textarea
          id="comments"
          placeholder="Tell us about your career goals"
          rows="5"
          cols="35"
          ></textarea>
          <br><br>

          <button id="submit" type="submit">
            Submit Survey
            </button>
            </form>
            </body>
            </html>
